<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Macro Log">
<meta name="theme-color" content="#070707">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="icon-192.png">
<title>Macro Log</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;600;700&family=Exo+2:wght@400;500;600&family=Chakra+Petch:wght@400;500;600;700&family=Oxanium:wght@400;500;600;700&family=Audiowide&family=Saira+Semi+Condensed:wght@400;500;600&display=swap">
<style>
/* Layout: single phone column. Sticky date + gym/rest bar, then the Consumed / Target / Left table, then six meal sections, bottom tab bar. */
:root{
  /* Red and Black (default) */
  --bg:#070707; --card:#141414; --ink:#f4f4f4; --mute:#9b9b9b; --line:#2a2a2a;
  --accent:#e5202f; --accent-ink:#ffffff; --accent-soft:#34090d; --accent-fg:#ff4d5a;
  --ok:#3ccf7c; --warn:#f0a93a; --bad:#ff8a5c; --track:#252525; --scrim:rgba(0,0,0,.7);
  --font-d:'Chakra Petch','Arial Narrow',system-ui,sans-serif;
  --font-b:'Chakra Petch',system-ui,-apple-system,'Segoe UI',sans-serif;
  color-scheme:dark;
}
:root[data-font="orbitron"]{--font-d:'Orbitron','Arial Narrow',system-ui,sans-serif;--font-b:'Exo 2',system-ui,-apple-system,sans-serif}
:root[data-font="oxanium"]{--font-d:'Oxanium','Arial Narrow',system-ui,sans-serif;--font-b:'Oxanium',system-ui,-apple-system,sans-serif}
:root[data-font="audio"]{--font-d:'Audiowide','Arial Narrow',system-ui,sans-serif;--font-b:'Saira Semi Condensed',system-ui,-apple-system,sans-serif}
:root[data-pal="blue"]{
  --bg:#eef3fb; --card:#ffffff; --ink:#0b1b33; --mute:#586a86; --line:#d3deef;
  --accent:#1d56d8; --accent-ink:#ffffff; --accent-soft:#dce8ff; --accent-fg:#1d56d8;
  --ok:#1d8548; --warn:#a96d12; --bad:#c8372a; --track:#dbe5f4; --scrim:rgba(8,20,40,.5);
  color-scheme:light;
}
:root[data-pal="navy"]{
  --bg:#0a1325; --card:#122038; --ink:#eaf0fb; --mute:#8fa3c4; --line:#223455;
  --accent:#e6b63c; --accent-ink:#1c1400; --accent-soft:#2f2a14; --accent-fg:#e6b63c;
  --ok:#4cc58a; --warn:#f0a93a; --bad:#ff6b6b; --track:#1d2d4a; --scrim:rgba(0,5,15,.7);
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--font-b);font-size:15px;line-height:1.35;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-block:env(safe-area-inset-top,0px) calc(84px + env(safe-area-inset-bottom,0px));-webkit-text-size-adjust:100%}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--bg)}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;-webkit-tap-highlight-color:transparent}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.num,td,.big{font-variant-numeric:tabular-nums}
#app{max-width:560px;margin:0 auto}

/* top */
.top{display:flex;align-items:center;justify-content:space-between;padding-top:12px}
.brand{font-family:var(--font-d);font-weight:700;font-size:22px;letter-spacing:.04em;text-transform:uppercase}
.pill{font-size:12px;font-weight:600;padding:3px 9px;border-radius:99px;background:var(--track);color:var(--mute)}
.pill.ok{background:color-mix(in srgb,var(--ok) 18%,transparent);color:var(--ok)}
.pill.bad{background:color-mix(in srgb,var(--bad) 18%,transparent);color:var(--bad)}

.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);padding:10px 0 8px;display:grid;gap:8px}
.datenav{display:grid;grid-template-columns:44px 1fr 44px;gap:8px;align-items:center}
.icon-btn{height:44px;border-radius:12px;background:var(--card);border:1px solid var(--line);font-size:20px;display:grid;place-items:center}
.datebtn{position:relative;height:44px;border-radius:12px;background:var(--card);border:1px solid var(--line);display:grid;place-items:center;text-align:center;overflow:hidden}
.datebtn b{font-family:var(--font-d);font-size:22px;font-weight:600;letter-spacing:.02em;line-height:1}
.datebtn small{display:block;color:var(--mute);font-size:11px;margin-top:2px}
.datebtn input{position:absolute;inset:0;opacity:0;width:100%;height:100%;font-size:16px}
.seg{display:grid;grid-template-columns:1fr 1fr auto;gap:6px;align-items:center}
.seg button.opt{height:38px;border-radius:10px;border:1px solid var(--line);background:var(--card);font-weight:600}
.seg button.opt[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.seg .hint{font-size:12px;color:var(--mute);padding-left:4px;white-space:nowrap}

/* summary table */
.card{background:var(--card);border:1px solid var(--line);border-radius:14px}
.sum{margin-top:6px;padding:6px 12px 10px}
.sum table{width:100%;border-collapse:collapse}
.sum th{font-size:11px;letter-spacing:.07em;text-transform:uppercase;color:var(--mute);font-weight:600;text-align:right;padding:6px 0 4px}
.sum th:first-child{text-align:left}
.sum td{padding:7px 0 2px;text-align:right;vertical-align:baseline;white-space:nowrap}
.sum td+td{padding-left:8px}
.sum td:first-child{text-align:left;font-weight:600}
.sum .cons{font-family:var(--font-d);font-size:22px;font-weight:600}
.sum .cons .tgt{font-family:var(--font-b);font-weight:400;font-size:12px}
.sum .tgt{color:var(--mute);font-size:13px}
.sum .left{font-weight:600;font-size:15px}
.sum .left small{display:block;font-weight:400;font-size:11px;color:var(--mute);white-space:normal}
.sum .left.ok{color:var(--ok)} .sum .left.bad{color:var(--bad)}
.sum tr.br td{padding:0 0 6px;border-bottom:1px solid var(--line)}
.sum tr.br:last-child td{border-bottom:0;padding-bottom:0}
.meter{position:relative;height:7px;border-radius:99px;background:var(--track);overflow:hidden}
.meter .band{position:absolute;top:0;bottom:0;background:color-mix(in srgb,var(--ink) 14%,transparent)}
.meter .fill{position:absolute;left:0;top:0;bottom:0;border-radius:99px;background:var(--accent)}
.meter .fill.in{background:var(--ok)} .meter .fill.over{background:var(--bad)}
.note{font-size:12px;color:var(--mute);margin:6px 2px 0}

/* meals */
.meals{display:grid;gap:10px;margin-top:12px}
.meal{padding:10px 12px}
.meal header{display:flex;align-items:baseline;gap:8px}
.meal h3{margin:0;font-family:var(--font-d);font-size:19px;font-weight:600;letter-spacing:.03em;text-transform:uppercase}
.meal .sub{flex:1;color:var(--mute);font-size:12px;min-width:0}
.add{height:34px;padding:0 12px;border-radius:99px;background:var(--accent-soft);color:var(--accent-fg);font-weight:600;font-size:14px;align-self:center}
.meal ul{list-style:none;margin:6px 0 0;padding:0}
.entry{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 10px;width:100%;text-align:left;padding:9px 0;border-top:1px solid var(--line)}
.entry .n{grid-column:1;grid-row:1;font-weight:500;overflow-wrap:anywhere}
.entry .k{grid-column:2;grid-row:1;font-weight:600;text-align:right;white-space:nowrap}
.entry .q{grid-column:1/-1;grid-row:2;color:var(--mute);font-size:12px}
.entry .m{grid-column:1/-1;grid-row:3;color:var(--mute);font-size:12px}
.none{margin:4px 0 2px;color:var(--mute);font-size:13px}
.actions{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}
.btn{height:46px;border-radius:12px;border:1px solid var(--line);background:var(--card);font-weight:600;padding:0 14px}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.danger{color:var(--bad);border-color:color-mix(in srgb,var(--bad) 40%,var(--line))}
.btn.full{grid-column:1/-1}

/* tab bar */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:25;background:var(--card);border-top:1px solid var(--line);
  display:grid;grid-template-columns:repeat(4,1fr);padding:6px max(8px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(8px,env(safe-area-inset-left,0px))}
.tabs button{display:grid;justify-items:center;gap:2px;padding:4px 0;font-size:11px;font-weight:600;color:var(--mute);min-height:48px}
.tabs button svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.tabs button[aria-current="page"]{color:var(--accent-fg)}

/* sheet */
#scrim{position:fixed;inset:0;z-index:40;background:var(--scrim);display:flex;align-items:flex-end;justify-content:center}
#sheet{width:100%;max-width:560px;max-height:90%;overflow-y:auto;background:var(--card);border-radius:18px 18px 0 0;
  padding:16px max(16px,env(safe-area-inset-right,0px)) calc(18px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));display:grid;gap:12px;align-content:start}
#sheet h2{margin:0;font-family:var(--font-d);font-size:24px;font-weight:600;letter-spacing:.02em;text-transform:uppercase}
.f{display:grid;gap:4px;min-width:0}
.f>label,.lbl{font-size:12px;color:var(--mute);font-weight:600;letter-spacing:.04em;text-transform:uppercase}
input[type=text],input[type=number],input[type=search],select,textarea{width:100%;min-width:0;height:46px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--ink);font:inherit;font-size:16px;padding:0 12px}
textarea{height:130px;padding:10px 12px;font-size:13px;font-family:ui-monospace,Menlo,monospace}
select{appearance:auto}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.row3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{height:36px;padding:0 14px;border-radius:99px;border:1px solid var(--line);background:var(--bg);font-weight:600}
.chip[aria-pressed="true"]{background:var(--accent-soft);border-color:var(--accent);color:var(--accent-fg)}
.prev{background:var(--bg);border-radius:12px;padding:10px 12px;display:grid;gap:4px}
.prev .big{font-family:var(--font-d);font-size:26px;font-weight:600}
.prev .line{color:var(--mute);font-size:13px}
.trow{display:grid;grid-template-columns:minmax(0,1fr) auto 32px;gap:8px;align-items:center;font-size:14px;padding:3px 0;border-bottom:1px solid var(--line)}
.trow small{color:var(--mute)}
.trow .x{width:32px;height:32px;border-radius:99px;font-size:20px;color:var(--mute)}
.btns{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.btns .btn.full{grid-column:1/-1}
.plist{list-style:none;margin:0;padding:0;display:grid;gap:2px;font-size:14px}
.plist li{display:flex;justify-content:space-between;gap:10px;padding:4px 0;border-bottom:1px solid var(--line)}
.plist li span:last-child{color:var(--mute);white-space:nowrap}

/* other views */
h2.vt{font-family:var(--font-d);font-size:28px;font-weight:600;letter-spacing:.02em;text-transform:uppercase;margin:16px 0 8px}
.list{display:grid;gap:8px}
.hrow{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 10px;text-align:left;width:100%;padding:11px 12px}
.hrow .d{grid-column:1;grid-row:1;font-weight:600}
.hrow .t{grid-column:1/-1;grid-row:2;color:var(--mute);font-size:12px}
.hrow .k{grid-column:2;grid-row:1;font-family:var(--font-d);font-size:22px;font-weight:600;text-align:right;white-space:nowrap}
.tag{font-size:11px;font-weight:600;padding:2px 7px;border-radius:99px;background:var(--track);color:var(--mute);margin-left:6px;vertical-align:middle}
.tag.ok{background:color-mix(in srgb,var(--ok) 18%,transparent);color:var(--ok)}
.group{margin-top:14px}
.group h3{margin:0 0 6px;font-size:12px;letter-spacing:.07em;text-transform:uppercase;color:var(--mute)}
.frow{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 10px;width:100%;text-align:left;padding:9px 12px;border-top:1px solid var(--line)}
.frow:first-child{border-top:0}
.frow .n{grid-column:1;grid-row:1;font-weight:500;overflow-wrap:anywhere}
.frow .k{grid-column:2;grid-row:1;font-weight:600;text-align:right;white-space:nowrap}
.frow .s{grid-column:1/-1;grid-row:2;color:var(--mute);font-size:12px}
.frow .m{grid-column:1/-1;grid-row:3;color:var(--mute);font-size:12px}
.set{padding:12px;display:grid;gap:10px;margin-bottom:10px}
.set h3{margin:0;font-family:var(--font-d);font-size:20px;font-weight:600;letter-spacing:.03em;text-transform:uppercase}
.tg{display:grid;grid-template-columns:70px 1fr 1fr;gap:8px;align-items:center}
.tg b{font-size:13px}
.tg input{height:40px;font-size:16px;text-align:center}
.tg .hd{font-size:11px;color:var(--mute);text-align:center;text-transform:uppercase;letter-spacing:.06em}
.sched{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.sched div{display:grid;gap:4px;justify-items:center;font-size:12px;font-weight:600}
.sched select{height:40px;padding:0 2px;font-size:14px;text-align:center}
.themes{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.tp{display:grid;gap:6px;justify-items:center;padding:10px 4px;border-radius:12px;border:2px solid var(--line);background:var(--bg);font-size:12px;font-weight:600}
.tp i{display:block;width:100%;height:34px;border-radius:8px;background:var(--b);position:relative;border:1px solid var(--line)}
.tp i::after{content:"";position:absolute;right:6px;top:50%;width:14px;height:14px;margin-top:-7px;border-radius:99px;background:var(--c)}
.tp[aria-pressed="true"]{border-color:var(--accent)}
.fonts{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.fp{display:grid;gap:4px;justify-items:start;text-align:left;padding:10px 12px;border-radius:12px;border:2px solid var(--line);background:var(--bg)}
.fp b{font-size:20px;font-weight:600;line-height:1.1}
.fp span{font-size:12px;color:var(--mute);font-family:system-ui,sans-serif}
.fp[aria-pressed="true"]{border-color:var(--accent)}
.vh{position:absolute;width:1px;height:1px;opacity:0;overflow:hidden;pointer-events:none}
.scan{display:grid;gap:6px}
.scan .btn{height:44px}
.scan .msg{font-size:13px;color:var(--mute)}
.scan .msg.bad{color:var(--bad)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom,0px));z-index:50;background:var(--ink);color:var(--bg);padding:9px 16px;border-radius:99px;font-size:14px;font-weight:600;max-width:90%}
@media (prefers-reduced-motion:no-preference){ #sheet{animation:up .18s ease-out} @keyframes up{from{transform:translateY(24px)}to{transform:none}} }
html{-webkit-text-size-adjust:100%}
[hidden]{display:none!important}
</style>
</head>

function fixCfg(c){var d=defCfg();c=c||{};
  ['gym','rest'].forEach(function(t){KEYS.forEach(function(k){var v=c.targets&&c.targets[t]&&c.targets[t][k[0]];
    if(!(Array.isArray(v)&&v.length===2&&isFinite(v[0])&&isFinite(v[1]))) {if(!c.targets)c.targets={};if(!c.targets[t])c.targets[t]={};c.targets[t][k[0]]=d.targets[t][k[0]]}})});
  if(!Array.isArray(c.sched)||c.sched.length!==7)c.sched=d.sched;
  if(!Array.isArray(c.custom))c.custom=[];
  if(!Array.isArray(c.hide))c.hide=[];

  c.u=c.u||0;return c}

/* ---------- cloud sync ---------- */
var dirty={},timer=null,flushing=false,loadTimer=null;
function setStatus(k){var el=$('#status');if(!el)return;var map={cloud:['Saved','ok'],saving:['Saving...',''],local:['Saved on phone','ok'],error:['Not synced','bad'],wait:['Connecting...','']};
  var m=map[k]||map.local;el.textContent=m[0];el.className='pill '+m[1];el.dataset.state=k}
var lastStatus='wait';
function status(k){lastStatus=k;setStatus(k)}
function mark(key){saveLocal();if(!DB){status('local');return}dirty[key]=1;status('saving');clearTimeout(timer);timer=setTimeout(flush,450)}
function flush(){
  if(flushing){timer=setTimeout(flush,300);return}
  flushing=true;
  (async function(){
    try{
      var keys;
      while((keys=Object.keys(dirty)).length){
        var key=keys[0];delete dirty[key];
        var ref=key==='cfg'?DB.doc('config/main'):DB.doc('days/'+key);
        var data=key==='cfg'?S.cfg:S.days[key];
        if(!data){await ref.delete()}else{await ref.set(clone(data))}
      }
      status('cloud');
    }catch(e){status('error')}
    flushing=false;
  })();
}
function startSync(){
  status('wait');
  loadTimer=setTimeout(function(){if(!synced)status('error')},10000);
  DB.collection('days').onSnapshot(function(snap){
    var changed=false;
    snap.docChanges().forEach(function(ch){
      var id=ch.doc.id;
      if(ch.type==='removed'){
        if(!snap.metadata.hasPendingWrites&&S.days[id]&&!dirty[id]){delete S.days[id];changed=true}
      }else{
        var d=ch.doc.data();
        if(d&&(!S.days[id]||(d.u||0)>(S.days[id].u||0))){S.days[id]=clone(d);changed=true}
      }
    });
    if(!snap.metadata.fromCache&&!synced){
      synced=true;clearTimeout(loadTimer);
      var remote={};snap.docs.forEach(function(d){remote[d.id]=d.data()});
      Object.keys(S.days).forEach(function(id){if(!remote[id]||(S.days[id].u||0)>(remote[id].u||0))dirty[id]=1});
      if(Object.keys(dirty).length){status('saving');flush()}else status('cloud');
    }
    if(changed){saveLocal();render()}
  },function(){status('error')});
  DB.doc('config/main').onSnapshot(function(snap){
    if(snap.metadata.hasPendingWrites)return;
    if(snap.exists){var d=snap.data();if((d.u||0)>(S.cfg.u||0)){S.cfg=fixCfg(clone(d));saveLocal();render()}}
    else if(!snap.metadata.fromCache&&(S.cfg.u||0)>0){dirty.cfg=1;flush()}
  },function(){});
}

  var out=[];order.forEach(function(id){if(inclHidden||S.cfg.hide.indexOf(id)<0)out.push(map[id])});
  return out}
function getFood(id){var l=allFoods(true);for(var i=0;i<l.length;i++)if(l[i].id===id)return l[i];return null}
function mkEntry(food,q,meal){
  var m=food.per?q/food.per:q;
  return {id:uid(),fid:food.id,n:food.n,sv:food.sv||'',q:q,u:food.per?'g':'x',m:meal,
    k:r2(food.k*m),p:r2(food.p*m),c:r2(food.c*m),f:r2(food.f*m),s:r2(food.s*m),e:food.e?1:0}}
function getDay(date,create){
  if(!S.days[date]&&create)S.days[date]={t:null,entries:[],u:Date.now()};
  return S.days[date]}
function touchDay(date){
  var d=S.days[date];
  if(d&&!d.t&&!d.entries.length){delete S.days[date]}else if(d){d.u=Date.now()}
  mark(date)}
function dayType(date){var d=S.days[date];if(d&&d.t)return d.t;return S.cfg.sched[parseD(date).getDay()]}
function sum(list){var t={k:0,p:0,c:0,f:0,s:0,est:false};
  list.forEach(function(e){t.k+=e.k;t.p+=e.p;t.c+=e.c;t.f+=e.f;t.s+=e.s;if(e.e)t.est=true});return t}

function summaryHTML(tot,type){
  var tg=S.cfg.targets[type];
  var rows=KEYS.map(function(kk){
    var key=kk[0],lo=tg[key][0],hi=tg[key][1],v=tot[key],unit=kk[2];
    var state,leftTxt,leftSub,cls='';
    if(lo>0){
      if(v<lo){state='';leftTxt=fmt(lo-v);leftSub='to minimum'}
      else if(v<=hi){state='in';leftTxt='In range';leftSub=fmt(hi-v)+' to max';cls='ok'}
      else if(key==='p'){state='in';leftTxt='Met';leftSub=(v-hi>=1?'+'+fmt(v-hi)+' above max':'at the top of range');cls='ok'}
      else{state='over';leftTxt='+'+fmt(v-hi);leftSub='over max';cls='bad'}
    }else{
      if(v<=hi){state='';leftTxt=fmt(hi-v);leftSub='under limit'}
      else{state='over';leftTxt='+'+fmt(v-hi);leftSub='over limit';cls='bad'}
    }
    var scale=Math.max(hi*1.18,v*1.02,1);
    var band=lo>0?'<span class="band" style="left:'+(lo/scale*100)+'%;width:'+((hi-lo)/scale*100)+'%"></span>':'<span class="band" style="left:0;width:'+(hi/scale*100)+'%"></span>';
    var tgtTxt=lo>0?fmt(lo)+'-'+fmt(hi):'under '+fmt(hi);
    var vtxt=key==='k'?fmt(v):fmt1(v);
    return '<tr><td>'+kk[1]+'</td><td class="cons">'+(tot.est&&key==='k'?'~':'')+vtxt+'<span class="tgt"> '+unit+'</span></td><td class="tgt">'+tgtTxt+'</td><td class="left '+cls+'">'+leftTxt+'<small>'+leftSub+'</small></td></tr>'+
      '<tr class="br"><td colspan="4"><div class="meter" role="img" aria-label="'+kk[1]+' '+vtxt+' of '+tgtTxt+'">'+band+'<span class="fill '+state+'" style="width:'+Math.min(100,v/scale*100)+'%"></span></div></td></tr>';
  }).join('');
  return '<div class="card sum"><table><thead><tr><th>Macro</th><th>Consumed</th><th>Target</th><th>Left</th></tr></thead><tbody>'+rows+'</tbody></table></div>'+
    (tot.est?'<p class="note">~ Includes estimated values.</p>':'')}

function addFoodSel(){var f=$('#a-food');return f&&f.value?getFood(f.value):null}
function syncAdd(resetQty){

function copySummary(){

  var lines=[dlabel(cur)+' ('+(type==='gym'?'Gym':'Rest')+' day)'];

function doCopy(id){

/* ---------- actions ---------- */
function setType(t){
  var auto=S.cfg.sched[parseD(cur).getDay()];
  var d=getDay(cur,true);d.t=(t===auto)?null:t;touchDay(cur);render()}
document.addEventListener('click',function(ev){
  var el=ev.target.closest&&ev.target.closest('[data-a]');
  if(ev.target.id==='scrim'){closeSheet();return}
  if(!el)return;
  var a=el.getAttribute('data-a');
  switch(a){
    case 'scan':{var cf=aiCfg();if(!cf.url||!cf.pass){scanMsg('Photo reading is not set up yet. Open Settings, Photo reading.',true)}else{$('#fe-photo').click()}break}
    case 'pickitem':{var it=scanItems[+el.dataset.i];if(it){fillFromItem(it,scanItems._note);$('#fe-choices').innerHTML=''}break}
    case 'aitest':aiTest();break;
    case 'font':S.cfg.font=el.dataset.f;S.cfg.u=Date.now();mark('cfg');render();break;
    case 'theme':S.cfg.theme=el.dataset.p;S.cfg.u=Date.now();mark('cfg');render();break;
    case 'tab':tab=el.dataset.tab;render();window.scrollTo(0,0);break;
    case 'prev':cur=addDays(cur,-1);render();break;
    case 'next':cur=addDays(cur,1);render();break;
    case 'type':setType(el.dataset.t);break;
    case 'add':openAdd(el.dataset.meal);break;
    case 'edit':openEdit(el.dataset.id);break;
    case 'close':closeSheet();break;
    case 'chip':{var q=$('#a-qty');q.value=el.dataset.v;AS.fresh=false;syncAdd(false);break}
    case 'doadd':doAdd();break;
    case 'another':addAnother();break;
    case 'untray':AS.tray.splice(+el.dataset.i,1);syncAdd(false);break;
    case 'newfoodin':{var keep=AS;openFood(null);FS.back=keep;break}
    case 'foodcancel':if(FS&&FS.back){var bk=FS.back;openAdd(bk.meal,null,bk.tray)}else closeSheet();break;
    case 'saveentry':saveEntry();break;
    case 'delentry':delEntry();break;
    case 'plan':openPlan();break;
    case 'planadd':applyPlan(false);break;
    case 'planrep':applyPlan(true);break;
    case 'clear':openClear();break;
    case 'doclear':if(S.days[cur]){S.days[cur].entries=[];touchDay(cur)}closeSheet();render();toast('Day cleared');break;
    case 'copy':copySummary();break;
    case 'docopy':doCopy(el.dataset['for']);break;
    case 'open':cur=el.dataset.date;tab='today';render();window.scrollTo(0,0);break;
    case 'newfood':openFood(null);break;
    case 'editfood':openFood(el.dataset.id);break;
    case 'festtoggle':el.setAttribute('aria-pressed',el.getAttribute('aria-pressed')==='true'?'false':'true');break;
    case 'savefood':saveFood();break;
    case 'delfood':delFood();break;
    case 'restorefood':{var id=FS.id;S.cfg.custom=S.cfg.custom.filter(function(x){return x.id!==id});S.cfg.u=Date.now();mark('cfg');closeSheet();render();toast('Original restored');break}
    case 'unhide':S.cfg.hide=[];S.cfg.u=Date.now();mark('cfg');render();break;
    case 'export':{
      var data=JSON.stringify({app:'macro-log',v:1,exported:new Date().toISOString(),cfg:S.cfg,days:S.days});
      $('#bk').innerHTML='<div class="f" style="margin-top:8px"><label for="bk-text">Backup text</label><textarea id="bk-text" readonly>'+esc(data)+'</textarea></div><button class="btn primary" style="margin-top:8px;width:100%" data-a="docopy" data-for="bk-text">Copy backup</button>';break}
    case 'importview':
      $('#bk').innerHTML='<div class="f" style="margin-top:8px"><label for="im-text">Paste backup text</label><textarea id="im-text" placeholder="Paste backup text, or an add-items text from Claude"></textarea></div><p class="note" id="im-msg" style="color:var(--bad)" hidden></p><button class="btn primary" style="margin-top:8px;width:100%" data-a="doimport">Restore or add (a full backup replaces current data)</button>';break;
    case 'doimport':doImport();break;
    case 'erase1':$('#erase').innerHTML='<p class="note" style="color:var(--bad);margin:0 0 8px">This cannot be undone. Erase everything?</p><div class="btns"><button class="btn" data-a="erase0">Keep my data</button><button class="btn danger" data-a="erase2">Yes, erase</button></div>';break;
    case 'erase0':renderSettings();break;
    case 'erase2':eraseAll();break;
  }
});
function doImport(){
  var msg=$('#im-msg');
  try{
    var o=JSON.parse($('#im-text').value.trim());
    if(o&&o.add&&typeof o.add==='object'){
      var a=o.add,added=0,touched=[];
      Object.keys(a.days||{}).forEach(function(date){
        var list=a.days[date];if(!Array.isArray(list))return;
        var d=getDay(date,true);
        list.forEach(function(e){
          if(!e||!e.id||!e.n||!isFinite(e.k))return;
          if(d.entries.some(function(x){return x.id===e.id}))return;
          d.entries.push(e);added++});
        d.u=Date.now();touched.push(date)});
      (a.foods||[]).forEach(function(f){
        if(!f||!f.id||!f.n)return;
        if(S.cfg.custom.some(function(x){return x.id===f.id}))return;
        S.cfg.custom.push(f);S.cfg.u=Date.now();dirty.cfg=1});
      touched.forEach(function(id){dirty[id]=1});
      saveLocal();if(DB){status('saving');flush()}else status('local');
      render();toast(added?added+' items added':'Nothing new to add');return}
    if(!o||typeof o.days!=='object'||o.days===null)throw new Error('bad');
    var oldIds=Object.keys(S.days);
    S.days=o.days;S.cfg=fixCfg(o.cfg);S.cfg.u=Date.now();
    Object.keys(S.days).forEach(function(id){var d=S.days[id];if(!Array.isArray(d.entries))d.entries=[];d.u=Date.now()});
    oldIds.concat(Object.keys(S.days)).forEach(function(id){dirty[id]=1});dirty.cfg=1;
    saveLocal();if(DB){status('saving');flush()}else status('local');
    render();toast('Backup restored');
  }catch(e){msg.textContent='That text is not a valid backup. Paste the full text you copied.';msg.hidden=false}}
function eraseAll(){
  var ids=Object.keys(S.days);S.days={};S.cfg=defCfg();S.cfg.u=Date.now();
  ids.forEach(function(id){dirty[id]=1});dirty.cfg=1;saveLocal();
  if(DB){status('saving');flush()}else status('local');
  render();toast('All data erased')}

document.addEventListener('input',function(ev){
  var t=ev.target;
  if(t.id==='a-qty'){AS.fresh=false;syncAdd(false)}
  else if(t.id==='e-qty')syncEdit();
  else if(t.id==='a-search'){AS.fresh=false;$('#a-food').innerHTML=foodOptions($('#a-group').value,t.value);syncAdd(true)}
});
document.addEventListener('change',function(ev){
  var t=ev.target;
  if(t.id==='a-group'){AS.fresh=false;$('#a-food').innerHTML=foodOptions(t.value,$('#a-search').value);syncAdd(true)}
  else if(t.id==='a-food'){AS.fresh=false;syncAdd(true)}
  else if(t.id==='fe-photo'){if(t.files&&t.files[0])handleScan(t.files[0])}
  else if(t.id==='ai-url'||t.id==='ai-pass'){aiSave({url:$('#ai-url').value.trim(),pass:$('#ai-pass').value.trim()})}
  else if(t.id==='datepick'){if(t.value){cur=t.value;render()}}
  else if(t.dataset&&t.dataset.tg){
    var p=t.dataset.tg.split('|'),v=parseFloat(t.value);
    if(!isFinite(v)||v<0){t.value=S.cfg.targets[p[0]][p[1]][+p[2]];return}
    S.cfg.targets[p[0]][p[1]][+p[2]]=v;S.cfg.u=Date.now();mark('cfg');toast('Target saved')}
  else if(t.dataset&&t.dataset.sch!==undefined){S.cfg.sched[+t.dataset.sch]=t.value;S.cfg.u=Date.now();mark('cfg');toast('Schedule saved')}
});
document.addEventListener('keydown',function(ev){if(ev.key==='Escape'&&!$('#scrim').hidden)closeSheet()});

/* ---------- photo reading ---------- */
var AIKEY='macrolog-ai';
function aiCfg(){try{var o=JSON.parse(localStorage.getItem(AIKEY)||'{}');return {url:(o.url||'').trim(),pass:(o.pass||'').trim()}}catch(e){return {url:'',pass:''}}}
function aiSave(o){try{localStorage.setItem(AIKEY,JSON.stringify(o))}catch(e){}}
function resizeImage(file,max){return new Promise(function(res,rej){
  var url=URL.createObjectURL(file),img=new Image();
  img.onload=function(){var sc=Math.min(1,max/Math.max(img.width,img.height)),w=Math.max(1,Math.round(img.width*sc)),h=Math.max(1,Math.round(img.height*sc)),c=document.createElement('canvas');
    c.width=w;c.height=h;c.getContext('2d').drawImage(img,0,0,w,h);URL.revokeObjectURL(url);res(c.toDataURL('image/jpeg',0.82).split(',')[1])};
  img.onerror=function(){URL.revokeObjectURL(url);rej(new Error('image'))};img.src=url})}
var scanItems=[];
function scanMsg(t,bad){var m=$('#fe-scan-msg');if(m){m.textContent=t;m.className='msg'+(bad?' bad':'')}}
function fillFromItem(it,note){
  var set=function(id,v){var e=$('#'+id);if(e)e.value=v};
  var nm=$('#fe-name');if(nm&&!nm.value.trim())nm.value=it.name;else if(nm&&nm.value.trim()!==it.name&&scanItems.length>1)nm.value=it.name;
  var per=it.basis==='100g'?'100':'0';set('fe-per',per);
  set('fe-sv',per==='100'?'per 100 g':(it.serving||'1 serving'));
  set('fe-k',Math.round(it.kcal));set('fe-p',it.protein);set('fe-c',it.carbs);set('fe-f',it.fat);set('fe-s',it.sugar);
  var est=$('#fe-est');if(est)est.setAttribute('aria-pressed',it.estimated?'true':'false');
  scanMsg((it.estimated?'Estimated from the photo. ':'Read from the label. ')+(note||'')+' Check the numbers, then Save.',false)}
async function handleScan(file){
  var cfg=aiCfg();
  if(!cfg.url||!cfg.pass){scanMsg('Photo reading is not set up yet. Open Settings, Photo reading.',true);return}
  var btn=$('#fe-scanbtn');if(btn)btn.disabled=true;
  scanMsg('Reading the photo...',false);
  try{
    var data=await resizeImage(file,1600);
    var hint=($('#fe-name')&&$('#fe-name').value.trim())||'';
    var r=await fetch(cfg.url,{method:'POST',headers:{'Content-Type':'application/json','X-App-Passcode':cfg.pass},body:JSON.stringify({image:data,mediaType:'image/jpeg',hint:hint})});
    var j=await r.json().catch(function(){return {}});
    if(!r.ok){scanMsg(j.error||'Could not read the photo.',true);return}
    scanItems=j.items||[];
    if(!scanItems.length){scanMsg(j.note||'No food found in that photo.',true);return}
    if(scanItems.length===1){fillFromItem(scanItems[0],j.note)}
    else{
      scanMsg('Found '+scanItems.length+' items. Tap the one you want.',false);
      var box=$('#fe-choices');if(box)box.innerHTML=scanItems.map(function(it,i){return '<button class="btn" data-a="pickitem" data-i="'+i+'">'+esc(it.name)+' · '+fmt(it.kcal)+' kcal</button>'}).join('');
      scanItems._note=j.note;
    }
  }catch(e){scanMsg('Could not reach the photo service. Check your internet and the Settings.',true)}
  finally{if(btn)btn.disabled=false;var f=$('#fe-photo');if(f)f.value=''}}
async function aiTest(){
  var u=$('#ai-url').value.trim(),pw=$('#ai-pass').value.trim(),out=$('#ai-msg');
  aiSave({url:u,pass:pw});
  if(!u||!pw){out.textContent='Enter both the address and the passcode.';return}
  out.textContent='Testing...';
  try{var r=await fetch(u,{headers:{'X-App-Passcode':pw}});var j=await r.json().catch(function(){return {}});
    out.textContent=r.ok?'Connected. You can read photos now.':(r.status===401?'Wrong passcode.':(j.error||'The address answered with an error.'))}
  catch(e){out.textContent='Could not reach that address. Check it for typos.'}}

/* ---------- boot ---------- */
loadLocal();render();
var lastToday=ymd(new Date());
document.addEventListener('visibilitychange',function(){
  if(document.visibilityState!=='visible')return;
  var t=ymd(new Date());
  if(t!==lastToday){if(cur===lastToday)cur=t;lastToday=t;render()}
});
if('serviceWorker' in navigator){window.addEventListener('load',function(){navigator.serviceWorker.register('sw.js').catch(function(){})})}
(async function(){
  try{var c=window.claude;DB=(c&&c.use)?await c.use('db'):null}catch(e){DB=null}
  if(DB){startSync()}else{status('local')}
})();
})();
</script>
