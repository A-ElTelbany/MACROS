<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Macro Log">
<meta name="theme-color" content="#070707">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="icon-192.png">
<title>Macro Log</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;600;700&family=Exo+2:wght@400;500;600&family=Chakra+Petch:wght@400;500;600;700&family=Oxanium:wght@400;500;600;700&family=Audiowide&family=Saira+Semi+Condensed:wght@400;500;600&display=swap">
<style>
/* Layout: single phone column. Sticky date + gym/rest bar, then the Consumed / Target / Left table, then six meal sections, bottom tab bar. */
:root{
  /* Red and Black (default) */
  --bg:#070707; --card:#141414; --ink:#f4f4f4; --mute:#9b9b9b; --line:#2a2a2a;
  --accent:#e5202f; --accent-ink:#ffffff; --accent-soft:#34090d; --accent-fg:#ff4d5a;
  --ok:#3ccf7c; --warn:#f0a93a; --bad:#ff8a5c; --track:#252525; --scrim:rgba(0,0,0,.7);
  --font-d:'Chakra Petch','Arial Narrow',system-ui,sans-serif;
  --font-b:'Chakra Petch',system-ui,-apple-system,'Segoe UI',sans-serif;
  color-scheme:dark;
}
:root[data-font="orbitron"]{--font-d:'Orbitron','Arial Narrow',system-ui,sans-serif;--font-b:'Exo 2',system-ui,-apple-system,sans-serif}
:root[data-font="oxanium"]{--font-d:'Oxanium','Arial Narrow',system-ui,sans-serif;--font-b:'Oxanium',system-ui,-apple-system,sans-serif}
:root[data-font="audio"]{--font-d:'Audiowide','Arial Narrow',system-ui,sans-serif;--font-b:'Saira Semi Condensed',system-ui,-apple-system,sans-serif}
:root[data-pal="blue"]{
  --bg:#eef3fb; --card:#ffffff; --ink:#0b1b33; --mute:#586a86; --line:#d3deef;
  --accent:#1d56d8; --accent-ink:#ffffff; --accent-soft:#dce8ff; --accent-fg:#1d56d8;
  --ok:#1d8548; --warn:#a96d12; --bad:#c8372a; --track:#dbe5f4; --scrim:rgba(8,20,40,.5);
  color-scheme:light;
}
:root[data-pal="navy"]{
  --bg:#0a1325; --card:#122038; --ink:#eaf0fb; --mute:#8fa3c4; --line:#223455;
  --accent:#e6b63c; --accent-ink:#1c1400; --accent-soft:#2f2a14; --accent-fg:#e6b63c;
  --ok:#4cc58a; --warn:#f0a93a; --bad:#ff6b6b; --track:#1d2d4a; --scrim:rgba(0,5,15,.7);
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--font-b);font-size:15px;line-height:1.35;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-block:env(safe-area-inset-top,0px) calc(84px + env(safe-area-inset-bottom,0px));-webkit-text-size-adjust:100%}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--bg)}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;-webkit-tap-highlight-color:transparent}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.num,td,.big{font-variant-numeric:tabular-nums}
#app{max-width:560px;margin:0 auto}

/* top */
.top{display:flex;align-items:center;justify-content:space-between;padding-top:12px}
.brand{font-family:var(--font-d);font-weight:700;font-size:22px;letter-spacing:.04em;text-transform:uppercase}
.pill{font-size:12px;font-weight:600;padding:3px 9px;border-radius:99px;background:var(--track);color:var(--mute)}
.pill.ok{background:color-mix(in srgb,var(--ok) 18%,transparent);color:var(--ok)}
.pill.bad{background:color-mix(in srgb,var(--bad) 18%,transparent);color:var(--bad)}

.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);padding:10px 0 8px;display:grid;gap:8px}
.datenav{display:grid;grid-template-columns:44px 1fr 44px;gap:8px;align-items:center}
.icon-btn{height:44px;border-radius:12px;background:var(--card);border:1px solid var(--line);font-size:20px;display:grid;place-items:center}
.datebtn{position:relative;height:44px;border-radius:12px;background:var(--card);border:1px solid var(--line);display:grid;place-items:center;text-align:center;overflow:hidden}
.datebtn b{font-family:var(--font-d);font-size:22px;font-weight:600;letter-spacing:.02em;line-height:1}
.datebtn small{display:block;color:var(--mute);font-size:11px;margin-top:2px}
.datebtn input{position:absolute;inset:0;opacity:0;width:100%;height:100%;font-size:16px}
.seg{display:grid;grid-template-columns:1fr 1fr auto;gap:6px;align-items:center}
.seg button.opt{height:38px;border-radius:10px;border:1px solid var(--line);background:var(--card);font-weight:600}
.seg button.opt[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.seg .hint{font-size:12px;color:var(--mute);padding-left:4px;white-space:nowrap}

/* summary table */
.card{background:var(--card);border:1px solid var(--line);border-radius:14px}
.sum{margin-top:6px;padding:6px 12px 10px}
.sum table{width:100%;border-collapse:collapse}
.sum th{font-size:11px;letter-spacing:.07em;text-transform:uppercase;color:var(--mute);font-weight:600;text-align:right;padding:6px 0 4px}
.sum th:first-child{text-align:left}
.sum td{padding:7px 0 2px;text-align:right;vertical-align:baseline;white-space:nowrap}
.sum td+td{padding-left:8px}
.sum td:first-child{text-align:left;font-weight:600}
.sum .cons{font-family:var(--font-d);font-size:22px;font-weight:600}
.sum .cons .tgt{font-family:var(--font-b);font-weight:400;font-size:12px}
.sum .tgt{color:var(--mute);font-size:13px}
.sum .left{font-weight:600;font-size:15px}
.sum .left small{display:block;font-weight:400;font-size:11px;color:var(--mute);white-space:normal}
.sum .left.ok{color:var(--ok)} .sum .left.bad{color:var(--bad)}
.sum tr.br td{padding:0 0 6px;border-bottom:1px solid var(--line)}
.sum tr.br:last-child td{border-bottom:0;padding-bottom:0}
.meter{position:relative;height:7px;border-radius:99px;background:var(--track);overflow:hidden}
.meter .band{position:absolute;top:0;bottom:0;background:color-mix(in srgb,var(--ink) 14%,transparent)}
.meter .fill{position:absolute;left:0;top:0;bottom:0;border-radius:99px;background:var(--accent)}
.meter .fill.in{background:var(--ok)} .meter .fill.over{background:var(--bad)}
.note{font-size:12px;color:var(--mute);margin:6px 2px 0}

/* meals */
.meals{display:grid;gap:10px;margin-top:12px}
.meal{padding:10px 12px}
.meal header{display:flex;align-items:baseline;gap:8px}
.meal h3{margin:0;font-family:var(--font-d);font-size:19px;font-weight:600;letter-spacing:.03em;text-transform:uppercase}
.meal .sub{flex:1;color:var(--mute);font-size:12px;min-width:0}
.add{height:34px;padding:0 12px;border-radius:99px;background:var(--accent-soft);color:var(--accent-fg);font-weight:600;font-size:14px;align-self:center}
.meal ul{list-style:none;margin:6px 0 0;padding:0}
.entry{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 10px;width:100%;text-align:left;padding:9px 0;border-top:1px solid var(--line)}
.entry .n{grid-column:1;grid-row:1;font-weight:500;overflow-wrap:anywhere}
.entry .k{grid-column:2;grid-row:1;font-weight:600;text-align:right;white-space:nowrap}
.entry .q{grid-column:1/-1;grid-row:2;color:var(--mute);font-size:12px}
.entry .m{grid-column:1/-1;grid-row:3;color:var(--mute);font-size:12px}
.none{margin:4px 0 2px;color:var(--mute);font-size:13px}
.actions{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}
.btn{height:46px;border-radius:12px;border:1px solid var(--line);background:var(--card);font-weight:600;padding:0 14px}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.danger{color:var(--bad);border-color:color-mix(in srgb,var(--bad) 40%,var(--line))}
.btn.full{grid-column:1/-1}

/* tab bar */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:25;background:var(--card);border-top:1px solid var(--line);
  display:grid;grid-template-columns:repeat(5,1fr);padding:6px max(8px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(8px,env(safe-area-inset-left,0px))}
.tabs button{display:grid;justify-items:center;gap:2px;padding:4px 0;font-size:11px;font-weight:600;color:var(--mute);min-height:48px}
.tabs button svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.tabs button[aria-current="page"]{color:var(--accent-fg)}

/* sheet */
#scrim{position:fixed;inset:0;z-index:40;background:var(--scrim);display:flex;align-items:flex-end;justify-content:center}
#sheet{width:100%;max-width:560px;max-height:90%;overflow-y:auto;background:var(--card);border-radius:18px 18px 0 0;
  padding:16px max(16px,env(safe-area-inset-right,0px)) calc(18px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));display:grid;gap:12px;align-content:start}
#sheet h2{margin:0;font-family:var(--font-d);font-size:24px;font-weight:600;letter-spacing:.02em;text-transform:uppercase}
.f{display:grid;gap:4px;min-width:0}
.f>label,.lbl{font-size:12px;color:var(--mute);font-weight:600;letter-spacing:.04em;text-transform:uppercase}
input[type=text],input[type=number],input[type=search],select,textarea{width:100%;min-width:0;height:46px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--ink);font:inherit;font-size:16px;padding:0 12px}
textarea{height:130px;padding:10px 12px;font-size:13px;font-family:ui-monospace,Menlo,monospace}
select{appearance:auto}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.row3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{height:36px;padding:0 14px;border-radius:99px;border:1px solid var(--line);background:var(--bg);font-weight:600}
.chip[aria-pressed="true"]{background:var(--accent-soft);border-color:var(--accent);color:var(--accent-fg)}
.prev{background:var(--bg);border-radius:12px;padding:10px 12px;display:grid;gap:4px}
.prev .big{font-family:var(--font-d);font-size:26px;font-weight:600}
.prev .line{color:var(--mute);font-size:13px}
.trow{display:grid;grid-template-columns:minmax(0,1fr) auto 32px;gap:8px;align-items:center;font-size:14px;padding:3px 0;border-bottom:1px solid var(--line)}
.trow small{color:var(--mute)}
.trow .x{width:32px;height:32px;border-radius:99px;font-size:20px;color:var(--mute)}
.btns{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.btns .btn.full{grid-column:1/-1}
.plist{list-style:none;margin:0;padding:0;display:grid;gap:2px;font-size:14px}
.plist li{display:flex;justify-content:space-between;gap:10px;padding:4px 0;border-bottom:1px solid var(--line)}
.plist li span:last-child{color:var(--mute);white-space:nowrap}

/* other views */
h2.vt{font-family:var(--font-d);font-size:28px;font-weight:600;letter-spacing:.02em;text-transform:uppercase;margin:16px 0 8px}
.list{display:grid;gap:8px}
.hrow{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 10px;text-align:left;width:100%;padding:11px 12px}
.hrow .d{grid-column:1;grid-row:1;font-weight:600}
.hrow .t{grid-column:1/-1;grid-row:2;color:var(--mute);font-size:12px}
.hrow .k{grid-column:2;grid-row:1;font-family:var(--font-d);font-size:22px;font-weight:600;text-align:right;white-space:nowrap}
.tag{font-size:11px;font-weight:600;padding:2px 7px;border-radius:99px;background:var(--track);color:var(--mute);margin-left:6px;vertical-align:middle}
.tag.ok{background:color-mix(in srgb,var(--ok) 18%,transparent);color:var(--ok)}
.group{margin-top:14px}
.group h3{margin:0 0 6px;font-size:12px;letter-spacing:.07em;text-transform:uppercase;color:var(--mute)}
.frow{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 10px;width:100%;text-align:left;padding:9px 12px;border-top:1px solid var(--line)}
.frow:first-child{border-top:0}
.frow .n{grid-column:1;grid-row:1;font-weight:500;overflow-wrap:anywhere}
.frow .k{grid-column:2;grid-row:1;font-weight:600;text-align:right;white-space:nowrap}
.frow .s{grid-column:1/-1;grid-row:2;color:var(--mute);font-size:12px}
.frow .m{grid-column:1/-1;grid-row:3;color:var(--mute);font-size:12px}
.set{padding:12px;display:grid;gap:10px;margin-bottom:10px}
.set h3{margin:0;font-family:var(--font-d);font-size:20px;font-weight:600;letter-spacing:.03em;text-transform:uppercase}
.tg{display:grid;grid-template-columns:70px 1fr 1fr;gap:8px;align-items:center}
.tg b{font-size:13px}
.tg input{height:40px;font-size:16px;text-align:center}
.tg .hd{font-size:11px;color:var(--mute);text-align:center;text-transform:uppercase;letter-spacing:.06em}
.sched{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.sched div{display:grid;gap:4px;justify-items:center;font-size:12px;font-weight:600}
.sched select{height:40px;padding:0 2px;font-size:14px;text-align:center}
.themes{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.tp{display:grid;gap:6px;justify-items:center;padding:10px 4px;border-radius:12px;border:2px solid var(--line);background:var(--bg);font-size:12px;font-weight:600}
.tp i{display:block;width:100%;height:34px;border-radius:8px;background:var(--b);position:relative;border:1px solid var(--line)}
.tp i::after{content:"";position:absolute;right:6px;top:50%;width:14px;height:14px;margin-top:-7px;border-radius:99px;background:var(--c)}
.tp[aria-pressed="true"]{border-color:var(--accent)}
.fonts{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.fp{display:grid;gap:4px;justify-items:start;text-align:left;padding:10px 12px;border-radius:12px;border:2px solid var(--line);background:var(--bg)}
.fp b{font-size:20px;font-weight:600;line-height:1.1}
.fp span{font-size:12px;color:var(--mute);font-family:system-ui,sans-serif}
.fp[aria-pressed="true"]{border-color:var(--accent)}
.vh{position:absolute;width:1px;height:1px;opacity:0;overflow:hidden;pointer-events:none}
.scan{display:grid;gap:6px}
.scan .btn{height:44px}
.scan .msg{font-size:13px;color:var(--mute)}
.scan .msg.bad{color:var(--bad)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom,0px));z-index:50;background:var(--ink);color:var(--bg);padding:9px 16px;border-radius:99px;font-size:14px;font-weight:600;max-width:90%}
@media (prefers-reduced-motion:no-preference){ #sheet{animation:up .18s ease-out} @keyframes up{from{transform:translateY(24px)}to{transform:none}} }

/* progress */
.seg.segn{grid-template-columns:repeat(auto-fit,minmax(0,1fr))}
.f input[type=date]{width:100%;min-width:0;height:46px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--ink);font:inherit;font-size:16px;padding:0 12px}
.pgc{padding:12px;margin-bottom:10px}
.pgc h3{margin:0 0 6px;font-size:12px;letter-spacing:.07em;text-transform:uppercase;color:var(--mute);display:flex;justify-content:space-between;gap:8px}
.pgc h3 b{color:var(--accent-fg);font-weight:600;letter-spacing:0;text-transform:none;text-align:right}
.pgc svg{display:block}
.pgc svg text{fill:var(--mute);font-size:10px}
.bigv{font-family:var(--font-d);font-size:28px;font-weight:600;line-height:1.1;margin-bottom:2px}
.bigv small{font-family:var(--font-b);font-size:13px;color:var(--mute);font-weight:400}
.mrow{display:flex;justify-content:space-between;gap:10px;padding:8px 0;border-top:1px solid var(--line);font-size:14px;width:100%;text-align:left}
.pgc h3+.mrow{border-top:0}
.mrow small{color:var(--mute)}
.mrow.lnk span:last-child{color:var(--mute);font-size:12px}
.enrg{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.enrg .chip{padding:0}
.wkrow{display:grid;grid-template-columns:repeat(auto-fit,minmax(0,1fr));gap:6px}
.wk{display:grid;justify-items:center;gap:2px;font-size:12px}
.wk i{display:block;width:100%;height:30px;border-radius:9px;background:var(--track)}
.wk.on i{background:var(--accent)}
.wk small{color:var(--mute);font-size:11px}
.exb{padding:8px 0;border-top:1px solid var(--line)}
.exh{display:flex;align-items:center;gap:8px}
.exh b{flex:1;min-width:0;overflow-wrap:anywhere;font-weight:600}
.xb{width:32px;height:32px;color:var(--mute);font-size:16px}
.scs{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.sc{height:34px;padding:0 10px;border-radius:9px;background:var(--track);font-size:13px;font-weight:600}
.sc.add{background:transparent;border:1px dashed var(--mute);color:var(--mute)}
html{-webkit-text-size-adjust:100%}
[hidden]{display:none!important}
</style>
</head>
<body>
<div id="app"></div>
<nav class="tabs" id="tabs" aria-label="Sections"></nav>
<div id="scrim" hidden><div id="sheet" role="dialog" aria-modal="true"></div></div>
<div class="toast" id="toast" hidden></div>

<script>
(function(){
'use strict';
/* ---------- helpers ---------- */
var $=function(s,r){return (r||document).querySelector(s)};
var esc=function(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})};
var fmt=function(n){return Math.round(n).toLocaleString('en-US')};
var fmt1=function(n){return (Math.round(n*10)/10).toLocaleString('en-US',{maximumFractionDigits:1})};
var r2=function(n){return Math.round(n*100)/100};
var uid=function(){return Math.random().toString(36).slice(2,9)};
var clone=function(o){return JSON.parse(JSON.stringify(o))};
var pad=function(n){return String(n).padStart(2,'0')};
var ymd=function(d){return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())};
var parseD=function(s){return new Date(s+'T12:00:00')};
var addDays=function(s,n){var d=parseD(s);d.setDate(d.getDate()+n);return ymd(d)};
var WD=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
var WDL=['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
var MON=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
var dlabel=function(s){var d=parseD(s);return WD[d.getDay()]+' '+d.getDate()+' '+MON[d.getMonth()]};
var KEYS=[['k','Calories','kcal'],['p','Protein','g'],['c','Carbs','g'],['f','Fat','g'],['s','Sugar','g']];
var MEALS=[['breakfast','Breakfast'],['lunch','Lunch'],['snack','Snacks'],['pregym','Pre-gym'],['postgym','Post-gym'],['dinner','Dinner']];
var MEALNAME={};MEALS.forEach(function(m){MEALNAME[m[0]]=m[1]});

/* ---------- food library (per serving, or per 100 g where per=100) ---------- */
/* [id, group, name, serving, kcal, protein, carbs, fat, sugar, estimated, per] */
var G_COMBO='Your combos', G_HOME='Your homemade standards', G_PP='Pre / post gym and light snacks', G_PRO='Proteins', G_CARB='Carbs and sides',
    G_BAR='Bars and protein snacks', G_HD='Healthy Diet (delivery)', G_CAL='Calify (delivery)', G_OTH='Other restaurants and bakery', G_EX='Extras and add-ons';
var RAW=[
 ['burrito',G_HOME,'Breakfast burrito (no rice)','1 burrito',318,36,6,12,1],
 ['beefpasta',G_HOME,'Minced-meat pasta','1 portion (batch / 5)',480,40,57,13,6,1],
 ['steak',G_HOME,'Steak, potato and 1 cup rice','1 plate',805,63,89,15,2],
 ['zinger',G_HOME,'High Protein Zinger burger','1 burger',393,44,38,6,5,1],
 ['pizzasw',G_HOME,'Pizza sandwich','1 sandwich',230,23,11,10,2,1],
 ['cheesepasta',G_HOME,'Cheese pasta (85 g spaghetti + cheese)','1 portion',230,12.9,27.6,7.3,1.3],
 ['cheesesauce',G_HOME,'Cheese sauce (Halloumi, Kashkaval, Philadelphia Light)','1 portion',96,8,1.3,6.5,0.8],

function defCfg(){return {u:0,
  targets:{gym:{k:[2450,2650],p:[150,190],c:[250,320],f:[65,85],s:[0,50]},rest:{k:[2250,2450],p:[150,190],c:[200,270],f:[60,80],s:[0,50]}},

function fixCfg(c){var d=defCfg();c=c||{};
  ['gym','rest'].forEach(function(t){KEYS.forEach(function(k){var v=c.targets&&c.targets[t]&&c.targets[t][k[0]];
    if(!(Array.isArray(v)&&v.length===2&&isFinite(v[0])&&isFinite(v[1]))) {if(!c.targets)c.targets={};if(!c.targets[t])c.targets[t]={};c.targets[t][k[0]]=d.targets[t][k[0]]}})});
  if(!Array.isArray(c.sched)||c.sched.length!==7)c.sched=d.sched;
  if(!Array.isArray(c.custom))c.custom=[];
  if(!Array.isArray(c.hide))c.hide=[];
  if(['black','blue','navy'].indexOf(c.theme)<0)c.theme='black';
  if(['chakra','orbitron','oxanium','audio'].indexOf(c.font)<0)c.font='chakra';
  c.u=c.u||0;return c}
function defProg(){return {w:{},m:[],mn:['Waist','Chest','Upper arm','Thigh'],g:{},split:['push','pull','legs','full',null,null,null]}}
function fixProg(p){var d=defProg();p=(p&&typeof p==='object')?p:{};
  if(!p.w||typeof p.w!=='object'||Array.isArray(p.w))p.w=d.w;
  if(!Array.isArray(p.m))p.m=[];
  if(!Array.isArray(p.mn)||!p.mn.length)p.mn=d.mn;
  if(!p.g||typeof p.g!=='object'||Array.isArray(p.g))p.g=d.g;
  Object.keys(p.g).forEach(function(k){var g=p.g[k];if(!g||!Array.isArray(g.ex)){delete p.g[k];return}g.ex.forEach(function(e){if(!Array.isArray(e.sets))e.sets=[]});if(!GT_OK[g.t])g.t='push'});
  p.m=p.m.filter(function(r){return r&&r.d&&r.v&&typeof r.v==='object'});
  if(!Array.isArray(p.split)||p.split.length!==7)p.split=d.split;
  return p}
var GT_OK={push:1,pull:1,legs:1,full:1};

/* ---------- cloud sync ---------- */
var dirty={},timer=null,flushing=false,loadTimer=null;
function setStatus(k){var el=$('#status');if(!el)return;var map={cloud:['Saved','ok'],saving:['Saving...',''],local:['Saved on phone','ok'],error:['Not synced','bad'],wait:['Connecting...','']};
  var m=map[k]||map.local;el.textContent=m[0];el.className='pill '+m[1];el.dataset.state=k}
var lastStatus='wait';
function status(k){lastStatus=k;setStatus(k)}
function mark(key){saveLocal();if(!DB){status('local');return}dirty[key]=1;status('saving');clearTimeout(timer);timer=setTimeout(flush,450)}
function flush(){
  if(flushing){timer=setTimeout(flush,300);return}
  flushing=true;
  (async function(){
    try{
      var keys;
      while((keys=Object.keys(dirty)).length){
        var key=keys[0];delete dirty[key];
        var ref=key==='cfg'?DB.doc('config/main'):DB.doc('days/'+key);
        var data=key==='cfg'?S.cfg:S.days[key];
        if(!data){await ref.delete()}else{await ref.set(clone(data))}
      }
      status('cloud');
    }catch(e){status('error')}
    flushing=false;
  })();
}
function startSync(){
  status('wait');
  loadTimer=setTimeout(function(){if(!synced)status('error')},10000);
  DB.collection('days').onSnapshot(function(snap){
    var changed=false;
    snap.docChanges().forEach(function(ch){
      var id=ch.doc.id;
      if(ch.type==='removed'){
        if(!snap.metadata.hasPendingWrites&&S.days[id]&&!dirty[id]){delete S.days[id];changed=true}
      }else{
        var d=ch.doc.data();
        if(d&&(!S.days[id]||(d.u||0)>(S.days[id].u||0))){S.days[id]=clone(d);changed=true}
      }
    });
    if(!snap.metadata.fromCache&&!synced){
      synced=true;clearTimeout(loadTimer);
      var remote={};snap.docs.forEach(function(d){remote[d.id]=d.data()});
      Object.keys(S.days).forEach(function(id){if(!remote[id]||(S.days[id].u||0)>(remote[id].u||0))dirty[id]=1});
      if(Object.keys(dirty).length){status('saving');flush()}else status('cloud');
    }
    if(changed){saveLocal();render()}
  },function(){status('error')});
  DB.doc('config/main').onSnapshot(function(snap){
    if(snap.metadata.hasPendingWrites)return;
    if(snap.exists){var d=snap.data();if((d.u||0)>(S.cfg.u||0)){S.cfg=fixCfg(clone(d));saveLocal();render()}}
    else if(!snap.metadata.fromCache&&(S.cfg.u||0)>0){dirty.cfg=1;flush()}
  },function(){});
}

function allFoods(inclHidden){
  var map={},order=[];
  BUILT.forEach(function(f){map[f.id]=f;order.push(f.id)});
  S.cfg.custom.forEach(function(f){if(!map[f.id])order.push(f.id);map[f.id]=f});
  var out=[];order.forEach(function(id){if(inclHidden||S.cfg.hide.indexOf(id)<0)out.push(map[id])});
  return out}
function getFood(id){var l=allFoods(true);for(var i=0;i<l.length;i++)if(l[i].id===id)return l[i];return null}
function mkEntry(food,q,meal){
  var m=food.per?q/food.per:q;
  return {id:uid(),fid:food.id,n:food.n,sv:food.sv||'',q:q,u:food.per?'g':'x',m:meal,
    k:r2(food.k*m),p:r2(food.p*m),c:r2(food.c*m),f:r2(food.f*m),s:r2(food.s*m),e:food.e?1:0}}
function getDay(date,create){
  if(!S.days[date]&&create)S.days[date]={t:null,entries:[],u:Date.now()};
  return S.days[date]}
function touchDay(date){
  var d=S.days[date];
  if(d&&!d.t&&!d.entries.length){delete S.days[date]}else if(d){d.u=Date.now()}
  mark(date)}
function dayType(date){var d=S.days[date];if(d&&d.t)return d.t;return S.cfg.sched[parseD(date).getDay()]}
function sum(list){var t={k:0,p:0,c:0,f:0,s:0,est:false};
  list.forEach(function(e){t.k+=e.k;t.p+=e.p;t.c+=e.c;t.f+=e.f;t.s+=e.s;if(e.e)t.est=true});return t}
function entriesOf(date){var d=S.days[date];return d?d.entries:[]}

function summaryHTML(tot,type){
  var tg=S.cfg.targets[type];
  var rows=KEYS.map(function(kk){
    var key=kk[0],lo=tg[key][0],hi=tg[key][1],v=tot[key],unit=kk[2];
    var state,leftTxt,leftSub,cls='';
    if(lo>0){
      if(v<lo){state='';leftTxt=fmt(lo-v);leftSub='to minimum'}
      else if(v<=hi){state='in';leftTxt='In range';leftSub=fmt(hi-v)+' to max';cls='ok'}
      else if(key==='p'){state='in';leftTxt='Met';leftSub=(v-hi>=1?'+'+fmt(v-hi)+' above max':'at the top of range');cls='ok'}
      else{state='over';leftTxt='+'+fmt(v-hi);leftSub='over max';cls='bad'}
    }else{
      if(v<=hi){state='';leftTxt=fmt(hi-v);leftSub='under limit'}
      else{state='over';leftTxt='+'+fmt(v-hi);leftSub='over limit';cls='bad'}
    }
    var scale=Math.max(hi*1.18,v*1.02,1);
    var band=lo>0?'<span class="band" style="left:'+(lo/scale*100)+'%;width:'+((hi-lo)/scale*100)+'%"></span>':'<span class="band" style="left:0;width:'+(hi/scale*100)+'%"></span>';
    var tgtTxt=lo>0?fmt(lo)+'-'+fmt(hi):'under '+fmt(hi);
    var vtxt=key==='k'?fmt(v):fmt1(v);
    return '<tr><td>'+kk[1]+'</td><td class="cons">'+(tot.est&&key==='k'?'~':'')+vtxt+'<span class="tgt"> '+unit+'</span></td><td class="tgt">'+tgtTxt+'</td><td class="left '+cls+'">'+leftTxt+'<small>'+leftSub+'</small></td></tr>'+
      '<tr class="br"><td colspan="4"><div class="meter" role="img" aria-label="'+kk[1]+' '+vtxt+' of '+tgtTxt+'">'+band+'<span class="fill '+state+'" style="width:'+Math.min(100,v/scale*100)+'%"></span></div></td></tr>';
  }).join('');
  return '<div class="card sum"><table><thead><tr><th>Macro</th><th>Consumed</th><th>Target</th><th>Left</th></tr></thead><tbody>'+rows+'</tbody></table></div>'+
    (tot.est?'<p class="note">~ Includes estimated values.</p>':'')}

function renderHistory(){
  var ids=Object.keys(S.days).filter(function(id){return S.days[id].entries&&S.days[id].entries.length}).sort().reverse();
  var rows=ids.map(function(id){
    var t=sum(S.days[id].entries),ty=dayType(id),tg=S.cfg.targets[ty];
    var ok=t.k>=tg.k[0]&&t.k<=tg.k[1];
    return '<button class="card hrow" data-a="open" data-date="'+id+'"><span class="d">'+esc(dlabel(id))+'<span class="tag'+(ok?' ok':'')+'">'+(ty==='gym'?'Gym':'Rest')+(ok?' · in range':'')+'</span></span><span class="k">'+fmt(t.k)+' kcal</span>'+
      '<span class="t">P '+fmt1(t.p)+' · C '+fmt1(t.c)+' · F '+fmt1(t.f)+' · Sugar '+fmt1(t.s)+'</span></button>'}).join('');
  var last=ids.slice(0,7),avg='';
  if(last.length){
    var a={k:0,p:0,c:0,f:0,s:0};last.forEach(function(id){var t=sum(S.days[id].entries);KEYS.forEach(function(k){a[k[0]]+=t[k[0]]})});
    KEYS.forEach(function(k){a[k[0]]/=last.length});
    avg='<div class="card hrow"><span class="d">Average of last '+last.length+' logged day'+(last.length>1?'s':'')+'</span><span class="k">'+fmt(a.k)+' kcal</span><span class="t">P '+fmt1(a.p)+' · C '+fmt1(a.c)+' · F '+fmt1(a.f)+' · Sugar '+fmt1(a.s)+'</span></div>'}

}

function addFoodSel(){var f=$('#a-food');return f&&f.value?getFood(f.value):null}
function syncAdd(resetQty){
  var f=addFoodSel(),qEl=$('#a-qty'),chips=$('#a-chips');if(!qEl)return;

function doImport(){
  var msg=$('#im-msg');
  try{
    var o=JSON.parse($('#im-text').value.trim());
    if(o&&o.add&&typeof o.add==='object'){
      var a=o.add,added=0,touched=[];
      Object.keys(a.days||{}).forEach(function(date){
        var list=a.days[date];if(!Array.isArray(list))return;
        var d=getDay(date,true);
        list.forEach(function(e){
          if(!e||!e.id||!e.n||!isFinite(e.k))return;
          if(d.entries.some(function(x){return x.id===e.id}))return;
          d.entries.push(e);added++});
        d.u=Date.now();touched.push(date)});
      (a.foods||[]).forEach(function(f){
        if(!f||!f.id||!f.n)return;
        if(S.cfg.custom.some(function(x){return x.id===f.id}))return;
        S.cfg.custom.push(f);S.cfg.u=Date.now();dirty.cfg=1;added++});
      touched.forEach(function(id){dirty[id]=1});
      saveLocal();if(DB){status('saving');flush()}else status('local');
      render();toast(added?added+(added===1?' item added':' items added'):'Nothing new to add');return}
    if(!o||typeof o.days!=='object'||o.days===null)throw new Error('bad');
    var oldIds=Object.keys(S.days);
    S.days=o.days;S.cfg=fixCfg(o.cfg);S.cfg.u=Date.now();if(o.prog)S.prog=fixProg(o.prog);
    Object.keys(S.days).forEach(function(id){var d=S.days[id];if(!Array.isArray(d.entries))d.entries=[];d.u=Date.now()});
    oldIds.concat(Object.keys(S.days)).forEach(function(id){dirty[id]=1});dirty.cfg=1;
    saveLocal();if(DB){status('saving');flush()}else status('local');
    render();toast('Backup restored');
  }catch(e){msg.textContent='That text is not a valid backup. Paste the full text you copied.';msg.hidden=false}}
function eraseAll(){
  var ids=Object.keys(S.days);S.days={};S.prog=defProg();S.cfg=defCfg();S.cfg.u=Date.now();
  ids.forEach(function(id){dirty[id]=1});dirty.cfg=1;saveLocal();
  if(DB){status('saving');flush()}else status('local');
  render();toast('All data erased')}

function resizeImage(file,max){return new Promise(function(res,rej){
  var url=URL.createObjectURL(file),img=new Image();
  img.onload=function(){var sc=Math.min(1,max/Math.max(img.width,img.height)),w=Math.max(1,Math.round(img.width*sc)),h=Math.max(1,Math.round(img.height*sc)),c=document.createElement('canvas');

  img.onerror=function(){URL.revokeObjectURL(url);rej(new Error('image'))};img.src=url})}

async function handleScan(file){
  var cfg=aiCfg();
  if(!cfg.url||!cfg.pass){scanMsg('Photo reading is not set up yet. Open Settings, Photo reading.',true);return}
  var btn=$('#fe-scanbtn');if(btn)btn.disabled=true;
  scanMsg('Reading the photo...',false);
  try{
    var data=await resizeImage(file,1600);
    var hint=($('#fe-name')&&$('#fe-name').value.trim())||'';
    var r=await fetch(cfg.url,{method:'POST',headers:{'Content-Type':'application/json','X-App-Passcode':cfg.pass},body:JSON.stringify({image:data,mediaType:'image/jpeg',hint:hint})});
    var j=await r.json().catch(function(){return {}});
    if(!r.ok){scanMsg(j.error||'Could not read the photo.',true);return}
    scanItems=j.items||[];
    if(!scanItems.length){scanMsg(j.note||'No food found in that photo.',true);return}
    if(scanItems.length===1){fillFromItem(scanItems[0],j.note)}

function weightCard(start,end){

function caloriesCard(start,end,range){

function proteinCard(start,end){
  var t=todayS(),n=0,sumP=0,hit=0,lo=0,hi=0;

  var avg=sumP/n,L=lo/n,H=hi/n,scale=Math.max(H*1.18,avg*1.02);
  var cls=avg>=L?'in':'';
  return '<section class="card pgc"><h3>Protein<b>avg '+fmt(avg)+' g / day</b></h3><p class="note" style="margin:0 0 8px">Target '+fmt(L)+'–'+fmt(H)+' g · '+hit+' of '+n+' days at or above the minimum</p>'+
    '<div class="meter"><span class="band" style="left:'+(L/scale*100)+'%;width:'+((H-L)/scale*100)+'%"></span><span class="fill '+cls+'" style="width:'+Math.min(100,avg/scale*100)+'%"></span></div></section>'}
function sleepCard(start,end){
  var pts=Object.keys(S.prog.w).filter(function(d){var r=S.prog.w[d];return d>=start&&d<=end&&r&&(isFinite(r.sl)||isFinite(r.en))}).sort();
  var sl=pts.filter(function(d){return isFinite(S.prog.w[d].sl)}),en=pts.filter(function(d){return isFinite(S.prog.w[d].en)});
  if(!pts.length)return '<section class="card pgc"><h3>Sleep and energy</h3>'+noData('Enter hours slept and an energy score (1 to 5) in the check-in to see them here.')+'</section>';
  var svals=sl.map(function(d){return S.prog.w[d].sl}),lo=Math.min(4,Math.floor(Math.min.apply(null,svals.concat([4])))),hi=Math.max(10,Math.ceil(Math.max.apply(null,svals.concat([10]))));
  var span=Math.max(dayDiff(start,end),1),X=function(d){return 26+dayDiff(start,d)/span*286},YS=function(v){return 86-(v-lo)/(hi-lo)*78},YE=function(v){return 86-(v-1)/4*78};
  function ln(ds,key,Y,col){var p=ds.map(function(d){return X(d).toFixed(1)+','+Y(S.prog.w[d][key]).toFixed(1)});
    return (ds.length>1?'<polyline fill="none" stroke="'+col+'" stroke-width="2" stroke-linejoin="round" points="'+p.join(' ')+'"/>':'')+(ds.length>40?'':ds.map(function(d){return '<circle cx="'+X(d).toFixed(1)+'" cy="'+Y(S.prog.w[d][key]).toFixed(1)+'" r="2.4" fill="'+col+'"/>'}).join(''))}
  var grid='';[lo,(lo+hi)/2,hi].forEach(function(v){grid+='<line x1="26" x2="312" y1="'+YS(v)+'" y2="'+YS(v)+'" stroke="var(--line)"/><text x="0" y="'+(YS(v)+3)+'">'+fmt1(v)+'h</text>'});
  [1,3,5].forEach(function(v){grid+='<text x="318" y="'+(YE(v)+3)+'">'+v+'</text>'});
  var avg=svals.length?svals.reduce(function(a,b){return a+b},0)/svals.length:null;
  return '<section class="card pgc"><h3>Sleep and energy<b>'+(avg!==null?'avg '+fmt1(avg)+' h sleep':'')+'</b></h3>'+svgAttr(104,'Sleep hours and energy')+grid+ln(sl,'sl',YS,'var(--mute)')+ln(en,'en',YE,'var(--accent)')+
    '<text x="26" y="100">'+sdate(start)+'</text><text x="312" y="100" text-anchor="end">'+sdate(end)+'</text></svg>'+
    '<p class="note" style="margin:2px 0 0">Grey = hours slept (left scale) · coloured = energy 1 to 5 (right scale)</p></section>'}
function measCard(){
  var recs=S.prog.m.slice().sort(function(a,b){return a.d<b.d?-1:1}),names=S.prog.mn;
  var rows=names.map(function(n){
    var has=recs.filter(function(r){return isFinite(r.v[n])});if(!has.length)return '';
    var l=has[has.length-1],p=has.length>1?has[has.length-2]:null,dl=p?l.v[n]-p.v[n]:null;
    return '<div class="mrow"><span>'+esc(n)+'</span><span>'+fmt1(l.v[n])+' cm'+(dl!==null&&dl!==0?' <small>('+(dl>0?'+':'−')+fmt1(Math.abs(dl))+')</small>':'')+'</span></div>'}).join('');
  var last=recs.length?recs[recs.length-1].d:null;
  return '<section class="card pgc"><h3>Body measurements<b>'+(last?'last: '+sdate(last):'')+'</b></h3>'+(rows||noData('No measurements yet. Add your first set below.'))+
    '<button class="btn full" style="margin-top:8px;width:100%" data-a="pgmeas">Add new measurements</button></section>'}
function checkinCard(){
  var d=PG.date||(PG.date=todayS()),r=S.prog.w[d]||{};
  if(PG.en===null||PG.enFor!==d){PG.en=isFinite(r.en)?r.en:null;PG.enFor=d}
  return '<section class="card pgc"><h3>Check-in<b>'+esc(dlabel(d))+'</b></h3>'+
   '<div class="f" style="margin-bottom:8px"><label for="pg-date">Date</label><input type="date" id="pg-date" value="'+d+'" max="'+todayS()+'"></div>'+
   '<div class="row2"><div class="f"><label for="pg-w">Body weight (kg)</label><input type="number" id="pg-w" inputmode="decimal" step="0.1" value="'+(isFinite(r.w)?r.w:'')+'" placeholder="e.g. 83.4"></div>'+
   '<div class="f"><label for="pg-sl">Sleep (hours)</label><input type="number" id="pg-sl" inputmode="decimal" step="0.25" value="'+(isFinite(r.sl)?r.sl:'')+'" placeholder="e.g. 7.5"></div></div>'+
   '<div class="f" style="margin-top:8px"><span class="lbl">Energy (1 to 5)</span><div class="enrg">'+[1,2,3,4,5].map(function(v){return '<button class="chip" data-a="pgen" data-v="'+v+'" aria-pressed="'+(PG.en===v)+'">'+v+'</button>'}).join('')+'</div></div>'+
   '<p class="note" id="pg-msg" style="color:var(--bad);margin:6px 0 0" hidden></p>'+
   '<button class="btn primary" style="margin-top:10px;width:100%" data-a="pgsave">Save check-in</button></section>'}

function bodyView(){
  var end=todayS(),start=addDays(end,-(PG.range-1));
  var rng='<div class="seg segn" style="margin:0 0 10px">'+[7,30,90].map(function(r){return '<button class="opt" data-a="pgrange" data-r="'+r+'" aria-pressed="'+(PG.range===r)+'">'+r+' days</button>'}).join('')+'</div>';
  return checkinCard()+rng+weightCard(start,end)+caloriesCard(start,end,PG.range)+proteinCard(start,end)+sleepCard(start,end)+measCard()}

/* gym */
function weekStart(date){return addDays(date,-parseD(date).getDay())}
function gymWeek(){
  var t=todayS(),ws=weekStart(t),planned=S.prog.split.filter(Boolean).length,chips='',done=0;
  for(var i=0;i<7;i++){var d=addDays(ws,i),ty=S.prog.split[i],ld=logged(d);if(ld)done++;
    if(ty||ld)chips+='<button class="wk'+(ld?' on':'')+'" data-a="pgopen" data-date="'+d+'"><i></i><b>'+WD[i]+'</b><small>'+esc(ty?GT[ty]:'Extra')+'</small></button>'}
  var streak=0;
  if(planned){
    var cnt=function(w0){var c=0;for(var i=0;i<7;i++)if(logged(addDays(w0,i)))c++;return c};
    var w=addDays(ws,-7);while(cnt(w)>=planned&&streak<520){streak++;w=addDays(w,-7)}
    if(cnt(ws)>=planned)streak++}
  return '<section class="card pgc"><h3>This week<b>'+done+' of '+(planned||'?')+' sessions</b></h3><div class="wkrow">'+chips+'</div>'+
    '<p class="note" style="margin:8px 0 0">'+(streak?'Streak: '+streak+' week'+(streak>1?'s':'')+' hitting '+planned+' sessions':'Hit all '+planned+' planned sessions in a week to start a streak')+'</p></section>'}
function gymLog(){
  var d=PG.gdate||(PG.gdate=todayS()),g=gLog(d,false),ty=g?g.t:defType(d);
  var seg='<div class="seg segn" style="margin:0 0 10px">'+Object.keys(GT).map(function(k){return '<button class="opt" data-a="pgt" data-t="'+k+'" aria-pressed="'+(ty===k)+'">'+GT[k]+'</button>'}).join('')+'</div>';
  var exs=g&&g.ex.length?g.ex.map(function(e){
    var lb=lastBefore(e.n,d),chips=e.sets.map(function(s,i){return '<button class="sc" data-a="pgsetedit" data-ex="'+e.id+'" data-i="'+i+'">'+esc(setTxt(s))+'</button>'}).join('');
    return '<div class="exb"><div class="exh"><b>'+esc(e.n)+'</b>'+(lb?'<span class="pill">last: '+esc(setTxt(lb.top))+'</span>':'')+'<button class="xb" data-a="pgexedit" data-ex="'+e.id+'" aria-label="Edit '+esc(e.n)+'">✎</button></div><div class="scs">'+chips+'<button class="sc add" data-a="pgsetadd" data-ex="'+e.id+'">+ set</button></div></div>'}).join(''):
    noData('No exercises yet for this day. Tap Add exercise to start.');
  var prevSame=Object.keys(S.prog.g).sort().filter(function(x){return x<d&&S.prog.g[x].t===ty&&S.prog.g[x].ex.length});
  var load=(!g||!g.ex.length)&&prevSame.length?'<button class="btn full" style="margin-top:8px;width:100%" data-a="pgload" data-from="'+prevSame[prevSame.length-1]+'">Load exercises from your last '+esc(GT[ty])+' day</button>':'';
  return '<section class="card pgc"><h3>Log a workout<b>'+esc(dlabel(d))+'</b></h3>'+
    '<div class="f" style="margin-bottom:8px"><label for="pg-gdate">Date</label><input type="date" id="pg-gdate" value="'+d+'" max="'+todayS()+'"></div>'+seg+exs+load+
    '<button class="btn primary" style="margin-top:10px;width:100%" data-a="pgexadd">Add exercise</button></section>'}
function strengthCard(){
  var names=exNames();
  if(!names.length)return '<section class="card pgc"><h3>Strength</h3>'+noData('Your strength charts start after your first logged workout.')+'</section>';
  if(!PG.ex||names.map(nm).indexOf(nm(PG.ex))<0)PG.ex=names[names.length-1];
  var ss=sessionsOf(PG.ex),sel='<div class="f" style="margin-bottom:8px"><label for="pg-exsel">Exercise</label><select id="pg-exsel">'+names.map(function(n){return '<option value="'+esc(n)+'"'+(nm(n)===nm(PG.ex)?' selected':'')+'>'+esc(n)+'</option>'}).join('')+'</select></div>';
  var best=null;ss.forEach(function(s){if(!best||s.top.w>best.w||(s.top.w===best.w&&s.top.r>best.r))best=s.top});
  var head='<h3>Strength<b>'+(best?'best set '+esc(setTxt(best)):'')+'</b></h3>';
  if(ss.length<2)return '<section class="card pgc">'+head+sel+noData(ss.length?'Log this exercise in one more session to see the line.':'No sets logged for this exercise yet.')+'</section>';
  var ss2=ss.slice(-14),vals=ss2.map(function(s){return s.top.w}),lo=Math.min.apply(null,vals),hi=Math.max.apply(null,vals);if(hi===lo){hi+=1;lo-=1}
  var pad=(hi-lo)*0.15;lo-=pad;hi+=pad;
  var X=function(i){return 26+i/(ss2.length-1)*290},Y=function(v){return 84-(v-lo)/(hi-lo)*74};
  var grid=[hi,(hi+lo)/2,lo].map(function(v){return '<line x1="26" x2="324" y1="'+Y(v)+'" y2="'+Y(v)+'" stroke="var(--line)"/><text x="0" y="'+(Y(v)+3)+'">'+fmt1(v)+'</text>'}).join('');
  var line='<polyline fill="none" stroke="var(--accent)" stroke-width="2.5" stroke-linejoin="round" points="'+ss2.map(function(s,i){return X(i).toFixed(1)+','+Y(s.top.w).toFixed(1)}).join(' ')+'"/>';
  var dots=ss2.map(function(s,i){return '<circle cx="'+X(i).toFixed(1)+'" cy="'+Y(s.top.w).toFixed(1)+'" r="3" fill="var(--ink)"/>'}).join('');
  var diff=ss2[ss2.length-1].top.w-ss2[0].top.w;
  return '<section class="card pgc">'+head+sel+svgAttr(104,'Top set per session')+grid+line+dots+'<text x="26" y="100">'+sdate(ss2[0].d)+'</text><text x="324" y="100" text-anchor="end">'+sdate(ss2[ss2.length-1].d)+'</text></svg>'+
    '<p class="note" style="margin:2px 0 0">Each dot = your heaviest set that session · '+(diff===0?'no change':(diff>0?'up ':'down ')+fmt1(Math.abs(diff))+' kg')+' since '+sdate(ss2[0].d)+'</p></section>'}
function recentSessions(){
  var ds=Object.keys(S.prog.g).filter(logged).sort().reverse().slice(0,6);
  if(!ds.length)return '';
  return '<section class="card pgc"><h3>Recent sessions</h3>'+ds.map(function(d){var g=S.prog.g[d],n=g.ex.reduce(function(a,e){return a+e.sets.length},0);
    return '<button class="mrow lnk" data-a="pgopen" data-date="'+d+'"><span>'+esc(dlabel(d))+' · '+esc(GT[g.t]||'')+'</span><span>'+g.ex.length+' exercise'+(g.ex.length===1?'':'s')+' · '+n+' sets</span></button>'}).join('')+'</section>'}
function gymView(){return gymWeek()+gymLog()+strengthCard()+recentSessions()}

function renderProgress(){
  $('#app').innerHTML='<div class="top"><span class="brand">Macro Log</span><span class="pill" id="status"></span></div><h2 class="vt">Progress</h2>'+
   '<div class="seg segn" style="margin:0 0 12px">'+[['body','Body'],['gym','Gym']].map(function(x){return '<button class="opt" data-a="pgview" data-v="'+x[0]+'" aria-pressed="'+(PG.view===x[0])+'">'+x[1]+'</button>'}).join('')+'</div>'+
   (PG.view==='gym'?gymView():bodyView());
  setStatus(lastStatus)}

/* progress actions */
function pgSaveCheckin(){
  var msg=$('#pg-msg'),d=PG.date||todayS(),w=parseFloat($('#pg-w').value),sl=parseFloat($('#pg-sl').value),bad='';
  var hasW=isFinite(w),hasSl=isFinite(sl),hasEn=PG.en!==null;
  if(!hasW&&!hasSl&&!hasEn)bad='Enter your weight, hours slept or an energy score first.';
  else if(hasW&&(w<30||w>300))bad='Weight should be between 30 and 300 kg.';
  else if(hasSl&&(sl<0||sl>24))bad='Sleep should be between 0 and 24 hours.';
  if(bad){msg.textContent=bad;msg.hidden=false;return}
  var r=S.prog.w[d]||(S.prog.w[d]={});
  if(hasW)r.w=r2(w);if(hasSl)r.sl=r2(sl);if(hasEn)r.en=PG.en;
  saveProg();renderProgress();toast('Check-in saved')}
function openMeas(){
  var d=todayS(),names=S.prog.mn;
  openSheet('<h2>Measurements</h2><div class="f"><label for="pm-date">Date</label><input type="date" id="pm-date" value="'+d+'" max="'+d+'"></div>'+
    '<div class="row2">'+names.map(function(n,i){return '<div class="f"><label for="pm-'+i+'">'+esc(n)+' (cm)</label><input type="number" inputmode="decimal" step="0.1" id="pm-'+i+'"></div>'}).join('')+'</div>'+
    '<div class="f"><label for="pm-new">Add another measurement (name)</label><input type="text" id="pm-new" placeholder="e.g. Hips, Calf, Neck" autocomplete="off"></div>'+
    '<div class="f"><label for="pm-newv">Its value (cm)</label><input type="number" inputmode="decimal" step="0.1" id="pm-newv"></div>'+
    '<p class="note" id="pm-err" style="margin:0;color:var(--bad)" hidden></p>'+
    '<div class="btns"><button class="btn" data-a="close">Cancel</button><button class="btn primary" data-a="pgmeassave">Save</button></div>')}
function saveMeas(){
  var d=$('#pm-date').value||todayS(),v={},names=S.prog.mn.slice();
  names.forEach(function(n,i){var x=parseFloat($('#pm-'+i).value);if(isFinite(x)&&x>0&&x<400)v[n]=r2(x)});
  var nn=$('#pm-new').value.trim(),nv=parseFloat($('#pm-newv').value);
  if(nn&&isFinite(nv)&&nv>0&&nv<400){var ex=names.filter(function(n){return nm(n)===nm(nn)})[0];if(ex)v[ex]=r2(nv);else{S.prog.mn.push(nn);v[nn]=r2(nv)}}
  if(!Object.keys(v).length){var er=$('#pm-err');er.textContent='Enter at least one measurement in cm.';er.hidden=false;return}
  var rec=S.prog.m.filter(function(r){return r.d===d})[0];
  if(rec){Object.keys(v).forEach(function(k){rec.v[k]=v[k]})}else S.prog.m.push({d:d,v:v});
  saveProg();closeSheet();renderProgress();toast('Measurements saved')}
function exById(id){var g=S.prog.g[PG.gdate];return g?g.ex.filter(function(e){return e.id===id})[0]:null}
function openExSheet(id){
  var e=id?exById(id):null,names=exNames();PG.exid=id||null;
  openSheet('<h2>'+(e?'Edit exercise':'Add exercise')+'</h2><div class="f"><label for="px-name">Exercise name</label><input type="text" id="px-name" list="px-list" value="'+esc(e?e.n:'')+'" placeholder="e.g. Bench press" autocomplete="off"><datalist id="px-list">'+names.map(function(n){return '<option value="'+esc(n)+'">'}).join('')+'</datalist></div>'+
    '<p class="note" id="px-err" style="margin:0;color:var(--bad)" hidden></p>'+
    '<div class="btns"><button class="btn" data-a="close">Cancel</button><button class="btn primary" data-a="pgexsave">'+(e?'Save':'Add')+'</button>'+(e?'<button class="btn danger full" data-a="pgexdel">Remove this exercise from the day</button>':'')+'</div>')}
function saveEx(){
  var n=$('#px-name').value.trim(),er=$('#px-err');
  if(!n){er.textContent='Give the exercise a name.';er.hidden=false;return}
  var g=gLog(PG.gdate,true);
  if(PG.exid){var e=exById(PG.exid);if(e)e.n=n}
  else{if(g.ex.some(function(x){return nm(x.n)===nm(n)})){er.textContent='That exercise is already in this day.';er.hidden=false;return}
    var known=exNames().filter(function(k){return nm(k)===nm(n)})[0];g.ex.push({id:uid(),n:known||n,sets:[]})}
  saveProg();closeSheet();renderProgress()}
function delEx(){var g=S.prog.g[PG.gdate];if(!g)return;g.ex=g.ex.filter(function(e){return e.id!==PG.exid});if(!g.ex.length)delete S.prog.g[PG.gdate];saveProg();closeSheet();renderProgress();toast('Exercise removed')}
function openSetSheet(exid,i){
  var e=exById(exid);if(!e)return;PG.set={ex:exid,i:i};
  var cur=i>=0?e.sets[i]:null,def=cur;
  if(!def){def=e.sets.length?e.sets[e.sets.length-1]:(function(){var l=lastBefore(e.n,PG.gdate);return l?l.top:null})()}
  openSheet('<h2>'+esc(e.n)+'</h2><p class="note" style="margin:0">'+(i>=0?'Edit set '+(i+1):'Set '+(e.sets.length+1))+'</p>'+
    '<div class="row2"><div class="f"><label for="ps-w">Weight (kg)</label><input type="number" inputmode="decimal" step="any" id="ps-w" value="'+(def?def.w:'')+'"></div><div class="f"><label for="ps-r">Reps</label><input type="number" inputmode="numeric" step="1" id="ps-r" value="'+(def?def.r:'')+'"></div></div>'+
    '<p class="note" id="ps-err" style="margin:0;color:var(--bad)" hidden></p>'+
    '<div class="btns"><button class="btn" data-a="close">Cancel</button><button class="btn primary" data-a="pgsetsave">'+(i>=0?'Save':'Add set')+'</button>'+
    (i<0?'<button class="btn full" data-a="pgsetmore">Add and log another set</button>':'<button class="btn danger full" data-a="pgsetdel">Delete this set</button>')+'</div>')}
function saveSet(more){
  var e=exById(PG.set.ex),w=parseFloat($('#ps-w').value),r=parseInt($('#ps-r').value,10),er=$('#ps-err');
  if(!e)return;
  if(!isFinite(w)||w<0||w>1000||!isFinite(r)||r<1||r>200){er.textContent='Enter the weight in kg (0 for bodyweight) and the reps.';er.hidden=false;return}
  if(PG.set.i>=0)e.sets[PG.set.i]={w:r2(w),r:r};else e.sets.push({w:r2(w),r:r});
  saveProg();
  if(more&&PG.set.i<0){renderProgress();openSetSheet(e.id,-1);return}
  closeSheet();renderProgress()}
function delSet(){var e=exById(PG.set.ex);if(e&&PG.set.i>=0)e.sets.splice(PG.set.i,1);saveProg();closeSheet();renderProgress();toast('Set deleted')}
function loadLast(from){
  var src=S.prog.g[from];if(!src)return;var g=gLog(PG.gdate,true);
  src.ex.forEach(function(e){if(!g.ex.some(function(x){return nm(x.n)===nm(e.n)}))g.ex.push({id:uid(),n:e.n,sets:[]})});
  saveProg();renderProgress()}

/* ---------- boot ---------- */
loadLocal();render();
var lastToday=ymd(new Date());
document.addEventListener('visibilitychange',function(){
  if(document.visibilityState!=='visible')return;
  var t=ymd(new Date());
  if(t!==lastToday){if(cur===lastToday)cur=t;lastToday=t;render()}
});
if('serviceWorker' in navigator){window.addEventListener('load',function(){navigator.serviceWorker.register('sw.js').catch(function(){})})}
(async function(){
  try{var c=window.claude;DB=(c&&c.use)?await c.use('db'):null}catch(e){DB=null}
  if(DB){startSync()}else{status('local')}
})();
})();
</script>
</body>
